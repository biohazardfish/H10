name: Project RPG: add quest to RPGops

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  add-to-project:
    if: github.event.label.name == 'quest'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - name: Resolve item info
        id: item
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            TYPE="issue"
            NUMBER="${{ github.event.issue.number }}"
            TITLE="${{ github.event.issue.title }}"
          else
            TYPE="pr"
            NUMBER="${{ github.event.pull_request.number }}"
            TITLE="${{ github.event.pull_request.title }}"
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "OK: $TYPE #$NUMBER — $TITLE"

      - name: Compute UTC dates
        id: dates
        run: |
          TODAY=$(date -u +%F)
          if TARGET=$(date -u -d "+14 days" +%F 2>/dev/null); then
            :
          else
            TARGET=$(python3 - <<'PY'
from datetime import datetime, timedelta
print((datetime.utcnow() + timedelta(days=14)).strftime('%Y-%m-%d'))
PY
            )
          fi

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Add item to RPGops project and set fields
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          NUMBER="${{ steps.item.outputs.number }}"
          TYPE="${{ steps.item.outputs.type }}"
          TODAY="${{ steps.dates.outputs.today }}"
          TARGET="${{ steps.dates.outputs.target }}"

          if [[ "$TYPE" == "issue" ]]; then
            CONTENT_QUERY='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){id title}}}'
            CONTENT_PATH='.data.repository.issue'
          else
            CONTENT_QUERY='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id title}}}'
            CONTENT_PATH='.data.repository.pullRequest'
          fi

          CONTENT_JSON=$(gh api graphql -f query="$CONTENT_QUERY" -f owner="$OWNER" -f repo="$REPO_NAME" -F number="$NUMBER")
          CONTENT_ID=$(echo "$CONTENT_JSON" | jq -r "$CONTENT_PATH.id")

          if [[ -z "$CONTENT_ID" || "$CONTENT_ID" == "null" ]]; then
            echo "Failed to resolve content id."
            exit 1
          fi

          PROJECT_QUERY='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id fields(first:50){nodes{__typename id name ... on ProjectV2SingleSelectField{options{id name}}}}}}}'
          PROJECT_JSON=$(gh api graphql -f query="$PROJECT_QUERY" -f login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")
          PROJECT_ID=$(echo "$PROJECT_JSON" | jq -r '.data.user.projectV2.id')

          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "Project not found: owner=$PROJECT_OWNER number=$PROJECT_NUMBER"
            exit 1
          fi

          FIELDS=$(echo "$PROJECT_JSON" | jq -c '.data.user.projectV2.fields.nodes')
          STATUS_FIELD_ID=$(echo "$FIELDS" | jq -r '.[] | select(.name=="Status") | .id')
          START_FIELD_ID=$(echo "$FIELDS" | jq -r '.[] | select(.name=="Start Date") | .id')
          TARGET_FIELD_ID=$(echo "$FIELDS" | jq -r '.[] | select(.name=="Target Date") | .id')
          STATUS_OPTION_ID=$(echo "$FIELDS" | jq -r '.[] | select(.name=="Status") | .options[]? | select(.name=="Todo") | .id')

          if [[ -z "$STATUS_FIELD_ID" || "$STATUS_FIELD_ID" == "null" ]]; then
            echo "Field missing: Status"
            exit 1
          fi
          if [[ -z "$START_FIELD_ID" || "$START_FIELD_ID" == "null" ]]; then
            echo "Field missing: Start Date"
            exit 1
          fi
          if [[ -z "$TARGET_FIELD_ID" || "$TARGET_FIELD_ID" == "null" ]]; then
            echo "Field missing: Target Date"
            exit 1
          fi
          if [[ -z "$STATUS_OPTION_ID" || "$STATUS_OPTION_ID" == "null" ]]; then
            echo "Status option missing: Todo"
            exit 1
          fi

          ADD_MUTATION='mutation($projectId:ID!,$contentId:ID!){addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){item{id}}}'
          ADD_JSON=$(gh api graphql -f query="$ADD_MUTATION" -f projectId="$PROJECT_ID" -f contentId="$CONTENT_ID")
          ITEM_ID=$(echo "$ADD_JSON" | jq -r '.data.addProjectV2ItemById.item.id')

          if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
            echo "Failed to add item to project."
            exit 1
          fi

          STATUS_MUTATION='mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){projectV2Item{id}}}'
          DATE_MUTATION='mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$date:Date!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{date:$date}}){projectV2Item{id}}}'

          gh api graphql -f query="$STATUS_MUTATION" -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$STATUS_OPTION_ID" > /dev/null
          gh api graphql -f query="$DATE_MUTATION" -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$START_FIELD_ID" -f date="$TODAY" > /dev/null
          gh api graphql -f query="$DATE_MUTATION" -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$TARGET_FIELD_ID" -f date="$TARGET" > /dev/null

          echo "project_id=$PROJECT_ID"
          echo "item_id=$ITEM_ID"
          echo "start_date=$TODAY"
          echo "target_date=$TARGET"
