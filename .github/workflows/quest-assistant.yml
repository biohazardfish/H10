name: Quest Assistant (generate Obsidian template)

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.label.name == 'quest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate quest template
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .quest-resources

          if [[ "${{ github.event_name }}" == "issues" ]]; then
            NUM="${{ github.event.issue.number }}"
            TITLE="${{ github.event.issue.title }}"
            URL="${{ github.event.issue.html_url }}"
            TYPE="Issue"
          else
            NUM="${{ github.event.pull_request.number }}"
            TITLE="${{ github.event.pull_request.title }}"
            URL="${{ github.event.pull_request.html_url }}"
            TYPE="PR"
          fi

          FILE=".quest-resources/Q${NUM}.md"
          if [[ -f "$FILE" ]]; then
            echo "Template already exists: $FILE (skip)"
            exit 0
          fi

          NOW="$(date -u +%FT%TZ)"

          cat > "$FILE" << EOF
          # Quest Q${NUM}: ${TITLE}

          ## 🎯 Quest Info
          - **Type:** ${TYPE}
          - **GitHub:** ${URL}
          - **Created (UTC):** ${NOW}
          - **Status:** 🟡 Planning

          ## 📜 Runlog & Decisions
          - (Paste Codex outputs / decisions here)

          ## 🧰 Artifacts
          - (Links to commits, files, notes)

          ## 🧭 Next Steps
          - [ ] Define acceptance criteria
          - [ ] Do the smallest test
          - [ ] Commit + document
          EOF

          echo "Created $FILE"

      - name: Commit quest resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Quest Assistant"
          git config user.email "assistant@users.noreply.github.com"

          git add .quest-resources/
          git commit -m "Add quest template for Q${{ github.event.issue.number || github.event.pull_request.number }}" || exit 0
          git push
