name: Quest Assistant (RPG)

on:
  issues:
    types: [labeled]

permissions:
  contents: write

jobs:
  quest_to_docs:
    if: github.event.label.name == 'quest'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write quest note
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          mkdir -p docs/quests
          TODAY="$(date -u +%F)"
          OUT="docs/quests/${TODAY}-issue-${ISSUE_NUMBER}.md"

          cat > "$OUT" <<EOF
          ---
          type: quest
          issue_number: ${ISSUE_NUMBER}
          title: "${ISSUE_TITLE}"
          url: "${ISSUE_URL}"
          author: "${ISSUE_AUTHOR}"
          created_utc: "${TODAY}"
          status: open
          labels:
            - quest
          ---

          # ${ISSUE_TITLE}

          - Source: ${ISSUE_URL}
          - Author: ${ISSUE_AUTHOR}
          - Created (UTC): ${TODAY}

          ## Quest brief

          ${ISSUE_BODY:-_(empty)_}
          EOF

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quests/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "quest: log issue #${{ github.event.issue.number }}"
          git push
